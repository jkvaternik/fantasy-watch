name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deploy job publish to Pages, nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the toolchain the lockfile was generated with: npm 11 prunes
          # optional platform subtrees that npm 10 then expects to find, so a
          # mismatched major breaks `npm ci` on entries nothing here installs.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc runs as part of build, so a type error fails the deploy too
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
